services:
  db:
    image: mysql:8.4
    container_name: writing-board-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      # .env 파일에서 값들을 가져옵니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      # 한글 깨짐 방지 설정
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 로컬 ./data 폴더에 DB 파일 저장 (삭제 방지)
      - ./data/mysql:/var/lib/mysql
  redis:
    image: redis:alpine
    container_name: writing-board-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} # 비밀번호 설정
    volumes:
      - ./data/redis:/data

  # 3. MongoDB (Chat History Storage)
  mongo:
    image: mongo:latest
    container_name: writing-board-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./data/mongo:/data/db