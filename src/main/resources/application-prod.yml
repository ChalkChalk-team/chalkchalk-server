spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
    mongodb:
      uri: ${MONGO_URI}
  application:
    name: writing-board-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: warn
    com.writingboard.server: info
    org.springframework.messaging: warn
    org.springframework.web.socket: warn
    org.springframework.data.mongodb: warn
    org.springframework.data.redis: warn

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 7200000
  refresh-expiration: 604800000

sentry:
  dsn: ${SENTRY_DSN}
  traces-sample-rate: 1.0
  send-default-pii: true
  exception-resolver-order: -2147483648

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name:chalkchalk-server}

cloud:
  r2:
    credentials:
      access-key: ${R2_ACCESS_KEY}
      secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET}
    region: "auto"