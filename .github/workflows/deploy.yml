name: Java CI/CD with Gradle (OCI Deployment)

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Prepare Server Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_KEY }}
          script: |
            cp /opt/writing-board/server-0.0.1-SNAPSHOT.jar /opt/writing-board/server-0.0.1-SNAPSHOT.jar.bak || true
            sudo systemctl stop writing-board

            cat <<EOF > /opt/writing-board/.env
            # DB
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            
            # Redis & Mongo
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            MONGO_URI=${{ secrets.MONGO_URI }}
            
            # Auth & Sentry
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            
            # Cloudflare R2
            R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }}
            R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            EOF
            
            chmod 600 /opt/writing-board/.env

      - name: Copy JAR to OCI via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_KEY }}
          source: "build/libs/!(*-plain).jar"
          target: "/opt/writing-board/"
          strip_components: 2

      - name: Start Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl start writing-board

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_KEY }}
          script: |
            sleep 15
            curl -f http://localhost:8080/actuator/health || echo "Health check failed (Security/403 is okay) but server is up"